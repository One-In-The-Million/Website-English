<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stranger Vocabulary Challenge</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Cinzel', serif;
}

body{
  background:black;
  overflow-y:auto;
  overflow-x:hidden;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#fff;
  position:relative;
  padding:90px 20px 30px;
}

/* BACKGROUND EFFECT */

body::before{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background:
  radial-gradient(circle at center,
  rgba(255,0,0,0.2),
  transparent 70%);
  animation:pulse 4s infinite;
}

@keyframes pulse{
  0%{opacity:0.4;}
  50%{opacity:1;}
  100%{opacity:0.4;}
}

/* FLOATING LIGHTS */

.light{
  position:absolute;
  width:10px;
  height:10px;
  background:red;
  border-radius:50%;
  box-shadow:0 0 20px red;
  animation:float 8s linear infinite;
}

@keyframes float{
  from{
    transform:translateY(100vh);
    opacity:0;
  }
  to{
    transform:translateY(-100vh);
    opacity:1;
  }
}

.container{
  width:90%;
  max-width:850px;
  background:rgba(0,0,0,0.82);
  border:2px solid red;
  border-radius:25px;
  padding:40px 30px;
  text-align:center;
  box-shadow:
  0 0 20px rgba(255,0,0,0.8),
  0 0 50px rgba(139,0,0,0.8);
  position:relative;
  z-index:2;
  animation:
  containerFloat 5s ease-in-out infinite;
  backdrop-filter:blur(4px);
}

.title{
  font-size:45px;
  color:#ff2a2a;
  text-shadow:
  0 0 10px red,
  0 0 20px red;
  margin-bottom:20px;
  letter-spacing:3px;
}

.subtitle{
  color:#ccc;
  margin-bottom:20px;
}

.hidden{
  display:none;
}

input{
  width:100%;
  padding:15px;
  margin:20px 0;
  border:none;
  border-radius:10px;
  background:#111;
  color:white;
  border:1px solid red;
  font-size:16px;
}

button{
  padding:14px 25px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-size:16px;
  margin:10px;
  transition:0.3s;
  background:#111;
  color:#ff4d4d;
  border:1px solid red;
  box-shadow:0 0 10px red;
}

button:hover{
  transform:scale(1.05);
  background:red;
  color:white;
  box-shadow:0 0 20px red;
}

.menu-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-top:20px;
}

.question-box{
  margin-top:25px;
  background:rgba(255,0,0,0.08);
  border:1px solid red;
  border-radius:15px;
  padding:25px;
}

.question{
  font-size:35px;
  margin-bottom:15px;
  color:#ff4d4d;
  text-shadow:0 0 10px red;
}

.options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-top:20px;
}

.result{
  margin-top:20px;
  font-size:22px;
  min-height:30px;
}

.score-board{
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  margin-top:20px;
}

.score-box{
  flex:1;
  min-width:120px;
  background:#111;
  border:1px solid red;
  border-radius:12px;
  padding:15px;
  box-shadow:0 0 10px red;
}

.final-score{
  font-size:70px;
  color:#ff2a2a;
  text-shadow:0 0 20px red;
  margin:20px 0;
}

.footer{
  margin-top:20px;
  color:#999;
  font-size:14px;
}

/* CONTROL BUTTONS */

.top-controls{
  position:fixed;
  top:15px;
  right:15px;
  display:flex;
  gap:10px;
  z-index:9999;
}

.control-btn{
  padding:10px 15px;
  font-size:14px;
}

.back-btn{
  position:fixed;
  top:15px;
  left:15px;
  z-index:9999;
}

/* ====================================== */
/* TAMBAHKAN CSS INI */
/* sebelum @media(max-width:600px) */
/* ====================================== */

/* EMOJI EFFECT */

.emoji{
  position:absolute;
  font-size:32px;
  opacity:0.25;
  z-index:1;
  animation:floatEmoji 8s ease-in-out infinite;
  pointer-events:none;
}

.e1{
  left:5%;
  top:15%;
}

.e2{
  left:90%;
  top:20%;
}

.e3{
  left:15%;
  top:85%;
}

.e4{
  left:80%;
  top:75%;
}

.e5{
  left:45%;
  top:8%;
}

.e6{
  left:65%;
  top:85%;
}

.e7{
  left:25%;
  top:45%;
}

.e8{
  left:75%;
  top:50%;
}

.e9{
  left:12%;
  top:55%;
}

.e10{
  left:88%;
  top:60%;
}

@keyframes floatEmoji{

  0%{
    transform:
    translateY(0px)
    rotate(0deg);
  }

  50%{
    transform:
    translateY(-20px)
    rotate(10deg);
  }

  100%{
    transform:
    translateY(0px)
    rotate(0deg);
  }

}

/* FOG EFFECT */

.fog{
  position:absolute;

  width:100%;
  height:100%;

  background:
  radial-gradient(
    circle,
    rgba(255,255,255,0.03),
    transparent 70%
  );

  animation:fogMove 15s linear infinite;

  z-index:0;
}

@keyframes fogMove{

  0%{
    transform:translateX(-40px);
  }

  50%{
    transform:translateX(40px);
  }

  100%{
    transform:translateX(-40px);
  }

}

/* PORTAL EFFECT */

.portal{
  position:absolute;

  width:260px;
  height:260px;

  border-radius:50%;

  border:
  3px solid rgba(255,0,0,0.3);

  box-shadow:
  0 0 25px red,
  inset 0 0 40px darkred;

  top:50%;
  left:50%;

  transform:
  translate(-50%,-50%);

  animation:
  portalSpin 20s linear infinite;

  z-index:0;
}

@keyframes portalSpin{

  from{
    transform:
    translate(-50%,-50%)
    rotate(0deg);
  }

  to{
    transform:
    translate(-50%,-50%)
    rotate(360deg);
  }

}

/* BLOOD LINE */

.blood-line{
  position:absolute;

  top:0;
  left:50%;

  width:4px;
  height:100%;

  background:
  linear-gradient(
    to bottom,
    transparent,
    red,
    transparent
  );

  opacity:0.25;

  animation:bloodPulse 2s infinite;
}

@keyframes bloodPulse{

  0%{
    opacity:0.1;
  }

  50%{
    opacity:0.5;
  }

  100%{
    opacity:0.1;
  }

}

/* TITLE EFFECT */

.title::after{
  content:" ✨";
}

/* QUESTION EFFECT */

.question::before{
  content:"🎯 ";
}

.question::after{
  content:" 👁";
}

/* SCORE EFFECT */

.score-box h3::before{
  content:"⚡ ";
}

/* FINAL SCORE EFFECT */

.final-score::before{
  content:"🏆 ";
}

.final-score::after{
  content:" 🏆";
}

/* BUTTON EFFECT */

button{
  position:relative;
  overflow:hidden;
}

button::before{
  content:"";

  position:absolute;

  top:0;
  left:-100%;

  width:100%;
  height:100%;

  background:
  linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,0.2),
    transparent
  );

  transition:0.5s;
}

button:hover::before{
  left:100%;
}

/* CONTAINER FLOAT */

.container{
  animation:
  containerFloat 5s
  ease-in-out infinite;
}

@keyframes containerFloat{

  0%{
    transform:translateY(0px);
  }

  50%{
    transform:translateY(-8px);
  }

  100%{
    transform:translateY(0px);
  }

}

/* GLOW BORDER */

.container::before{
  content:"";

  position:absolute;

  top:-2px;
  left:-2px;

  width:calc(100% + 4px);
  height:calc(100% + 4px);

  border-radius:20px;

  background:
  linear-gradient(
    45deg,
    red,
    transparent,
    darkred,
    transparent,
    red
  );

  z-index:-1;

  opacity:0.3;

  animation:
  borderGlow 6s linear infinite;
}

@keyframes borderGlow{

  0%{
    filter:hue-rotate(0deg);
  }

  100%{
    filter:hue-rotate(360deg);
  }

}

/* FOOTER EFFECT */

.footer::before{
  content:"🌑 ";
}

.footer::after{
  content:" 👁";
}

/* INPUT EFFECT */

input:focus{
  outline:none;

  box-shadow:
  0 0 15px red;
}

/* RESULT EFFECT */

.result{
  animation:
  fadeResult 1s infinite alternate;
}

@keyframes fadeResult{

  from{
    opacity:0.7;
  }

  to{
    opacity:1;
  }

}

/* QUESTION BOX GLOW */

.question-box{
  animation:
  questionGlow 3s infinite;
}

@keyframes questionGlow{

  0%{
    box-shadow:
    0 0 10px red;
  }

  50%{
    box-shadow:
    0 0 25px red;
  }

  100%{
    box-shadow:
    0 0 10px red;
  }

}

/* SCORE BOX FLOAT */

.score-box{
  animation:
  scoreFloat 4s infinite;
}

@keyframes scoreFloat{

  0%{
    transform:translateY(0px);
  }

  50%{
    transform:translateY(-5px);
  }

  100%{
    transform:translateY(0px);
  }

}

/* BODY EXTRA RED FLASH */

body::after{
  content:"";

  position:absolute;

  width:100%;
  height:100%;

  background:
  rgba(255,0,0,0.02);

  animation:
  flashRed 5s infinite;

  pointer-events:none;
}

@keyframes flashRed{

  0%{
    opacity:0;
  }

  50%{
    opacity:1;
  }

  100%{
    opacity:0;
  }

}

/* MOBILE IMPROVEMENT */

@media(max-width:768px){

  body{
    padding-top:120px;
  }

  .container{
    width:95%;
    padding:30px 20px;
  }

  .title{
    font-size:28px;
    line-height:1.3;
  }

  .subtitle{
    font-size:14px;
  }

  .question{
    font-size:24px;
  }

  button{
    width:100%;
    margin:8px 0;
  }

  .score-board{
    flex-direction:column;
  }

  .top-controls{
    right:10px;
    top:10px;
  }

  .back-btn{
    left:10px;
    top:10px;
  }

}

@media(max-width:600px){

  .menu-buttons,
  .options{
    grid-template-columns:1fr;
  }

  .title{
    font-size:32px;
  }

  .question{
    font-size:26px;
  }

}

</style>
</head>
<body>

<!-- BACKSOUND -->
<audio id="bgMusic" loop>
  <source src="Stranger-Things-Theme.mp3" type="audio/mpeg">
</audio>

<!-- CLICK SOUND -->
<audio id="clickSound">
  <source src="click.mp3" type="audio/mpeg">
</audio>

<!-- LIGHT EFFECTS -->
<div class="light" style="left:10%; animation-delay:0s;"></div>
<div class="light" style="left:30%; animation-delay:2s;"></div>
<div class="light" style="left:50%; animation-delay:4s;"></div>
<div class="light" style="left:70%; animation-delay:1s;"></div>
<div class="light" style="left:90%; animation-delay:3s;"></div>

<!-- FLOATING EMOJIS -->
<div class="emoji e1">👁</div>
<div class="emoji e2">⚡</div>
<div class="emoji e3">🩸</div>
<div class="emoji e4">🕷</div>
<div class="emoji e5">💀</div>
<div class="emoji e6">🔮</div>
<div class="emoji e7">🌑</div>
<div class="emoji e8">🧠</div>
<div class="emoji e9">👹</div>
<div class="emoji e10">🔥</div>

<!-- EXTRA EFFECT -->
<div class="fog"></div>
<div class="portal"></div>
<div class="blood-line"></div>
<div class="container">

<!-- MUSIC BUTTON -->
<div class="top-controls hidden" id="musicControls">

<button
class="control-btn"
id="musicBtn"
onclick="toggleMusic()"
>
🔊 MUSIC ON
</button>

</div>

<!-- BACK BUTTON -->
<button
class="control-btn back-btn hidden"
id="backButton"
onclick="goBack()"
>
⬅ BACK
</button>


<!-- LOGIN -->
<div id="loginPage">

<h1 class="title">STRANGER VOCABULARY CHALLENGE</h1>

<p class="subtitle">
Enter your name to enter the Upside Down...
</p>

<input type="text" id="playerName" placeholder="Your Name">

<button onclick="startApp()">
ENTER
</button>

</div>

<!-- HOME -->
<div id="homePage" class="hidden">

<h1 class="title">HOME</h1>

<h2 id="welcomeText"></h2>

<p class="subtitle">
Choose your challenge
</p>

<div class="menu-buttons">

<button onclick="selectChallenge('synonym')">
SYNONYM
</button>

<button onclick="selectChallenge('antonym')">
ANTONYM
</button>

</div>

</div>

<!-- LEVEL -->
<div id="levelPage" class="hidden">

<h1 class="title">SELECT LEVEL</h1>

<div class="menu-buttons">

<button onclick="startQuiz('easy')">
EASY
</button>

<button onclick="startQuiz('hard')">
HARD
</button>

<button onclick="startQuiz('very hard')">
VERY HARD
</button>

</div>

</div>

<!-- QUIZ -->
<div id="quizPage" class="hidden">

<h1 class="title">VOCAB QUIZ</h1>

<div class="score-board">

<div class="score-box">
<h3>SCORE</h3>
<p id="score">0</p>
</div>

<div class="score-box">
<h3>QUESTION</h3>
<p id="questionNumber">1 / 10</p>
</div>

<div class="score-box">
<h3>LEVEL</h3>
<p id="currentLevel">EASY</p>
</div>

</div>

<div class="question-box">

<div class="question" id="questionWord">
Happy
</div>

<p id="challengeType">
Choose the synonym:
</p>

<div class="options" id="options"></div>

<div class="result" id="result"></div>

</div>

</div>

<!-- RESULT -->
<div id="resultPage" class="hidden">

<h1 class="title">FINAL SCORE</h1>

<h2 id="finalName"></h2>

<div class="final-score" id="finalScore">
100
</div>

<p id="finalMessage"></p>

<button onclick="restartGame()">
PLAY AGAIN
</button>

</div>

<div class="footer">
Inspired by the mysterious atmosphere of Stranger Things
</div>

</div>

<script>

/* QUESTIONS */

const synonymQuestions = {
easy:[
{word:"Happy",correct:"Joyful",options:["Sad","Joyful","Angry","Cold"]},
{word:"Big",correct:"Large",options:["Large","Play","Tiny","Dark"]},
{word:"Fast",correct:"Quick",options:["Slow","Quick","Weak","Heavy"]},
{word:"Smart",correct:"Intelligent",options:["Lazy","Weak","Hot","Intelligent"]},
{word:"Beautiful",correct:"Pretty",options:["Ugly","Cool","Bad","Pretty"]},
{word:"Easy",correct:"Simple",options:["Hard","Small","Simple","Sharp"]},
{word:"Strong",correct:"Powerful",options:["Powerful","Easy","Soft","Poor"]},
{word:"Begin",correct:"Start",options:["End","Close","Start","Break"]},
{word:"End",correct:"Finish",options:["Open","Angry","Rise","Finish"]},
{word:"Small",correct:"Tiny",options:["Huge","Tiny","Tall","Fast"]}
],

hard:[
{word:"Ancient",correct:"Old",options:["Modern","Old","Future","New"]},
{word:"Brave",correct:"Courageous",options:["Weak","Coward","Courageous","Lazy"]},
{word:"Rapid",correct:"Fast",options:["Slow","Fast","Heavy","Cold"]},
{word:"Famous",correct:"Well-known",options:["Well-known","Unknown","Dark","Silent"]},
{word:"Fragile",correct:"Delicate",options:["Strong","Hard","Heavy","Delicate"]},
{word:"Massive",correct:"Huge",options:["Tiny","Cold","Flat","Huge"]},
{word:"Silent",correct:"Quiet",options:["Quiet","Loud","Sharp","Heavy"]},
{word:"Difficult",correct:"Hard",options:["Easy","Safe","Soft","Hard"]},
{word:"Accurate",correct:"Correct",options:["Wrong","Correct","Weak","Slow"]},
{word:"Wealthy",correct:"Rich",options:["Poor","Rich","Hungry","Weak"]}
],

"very hard":[
{word:"Benevolent",correct:"Kind",options:["Kind","Cruel","Greedy","Angry"]},
{word:"Meticulous",correct:"Careful",options:["Careful","Careless","Weak","Fast"]},
{word:"Obsolete",correct:"Outdated",options:["Modern","Bright","Useful","Outdated"]},
{word:"Ambiguous",correct:"Unclear",options:["Clear","Unclear","Sharp","Strong"]},
{word:"Eloquent",correct:"Persuasive",options:["Silent","Persuasive","Weak","Cold"]},
{word:"Tedious",correct:"Boring",options:["Fun","Fast","Exciting","Boring"]},
{word:"Hostile",correct:"Aggressive",options:["Friendly","Calm","Soft","Aggressive"]},
{word:"Scarce",correct:"Rare",options:["Common","Weak","Cheap","Rare"]},
{word:"Vivid",correct:"Bright",options:["Bright","Dark","Weak","Silent"]},
{word:"Peculiar",correct:"Strange",options:["Normal","Easy","Strange","Soft"]}
]
};

const antonymQuestions = {
easy:[
{word:"Hot",correct:"Cold",options:["Warm","Cold","Fast","Big"]},
{word:"Happy",correct:"Sad",options:["Joyful","Sad","Tall","Strong"]},
{word:"Big",correct:"Small",options:["Large","Wide","Small","Heavy"]},
{word:"Fast",correct:"Slow",options:["Quick","Slow","Bright","Sharp"]},
{word:"Strong",correct:"Weak",options:["Hard","Weak","Heavy","Rich"]},
{word:"Open",correct:"Close",options:["Close","Push","Rise","Start"]},
{word:"Early",correct:"Late",options:["Soon","Late","Morning","Night"]},
{word:"Light",correct:"Dark",options:["Bright","Dark","Clear","Warm"]},
{word:"Easy",correct:"Difficult",options:["Simple","Difficult","Soft","Safe"]},
{word:"Tall",correct:"Short",options:["High","Short","Thin","Strong"]}
],

hard:[
{word:"Ancient",correct:"Modern",options:["Old","Modern","Weak","Past"]},
{word:"Rich",correct:"Poor",options:["Hungry","Poor","Dark","Strong"]},
{word:"Victory",correct:"Defeat",options:["Win","Defeat","Fight","Game"]},
{word:"Brave",correct:"Cowardly",options:["Strong","Cowardly","Fast","Smart"]},
{word:"Expand",correct:"Shrink",options:["Grow","Shrink","Open","Rise"]},
{word:"Accept",correct:"Reject",options:["Receive","Reject","Like","Build"]},
{word:"Increase",correct:"Decrease",options:["Grow","Decrease","Improve","Lift"]},
{word:"Noisy",correct:"Quiet",options:["Loud","Quiet","Fast","Heavy"]},
{word:"Permanent",correct:"Temporary",options:["Long","Temporary","Fixed","Strong"]},
{word:"Generous",correct:"Selfish",options:["Kind","Selfish","Friendly","Smart"]}
],

"very hard":[
{word:"Optimistic",correct:"Pessimistic",options:["Hopeful","Pessimistic","Strong","Bright"]},
{word:"Complex",correct:"Simple",options:["Hard","Simple","Large","Fast"]},
{word:"Abundant",correct:"Scarce",options:["Many","Scarce","Rich","Heavy"]},
{word:"Transparent",correct:"Opaque",options:["Clear","Opaque","Bright","Sharp"]},
{word:"Hostile",correct:"Friendly",options:["Aggressive","Friendly","Loud","Strong"]},
{word:"Inferior",correct:"Superior",options:["Weak","Superior","Poor","Old"]},
{word:"Rigid",correct:"Flexible",options:["Hard","Flexible","Strong","Sharp"]},
{word:"Artificial",correct:"Natural",options:["Fake","Natural","Bright","Cheap"]},
{word:"Bold",correct:"Timid",options:["Brave","Timid","Strong","Quick"]},
{word:"Expand",correct:"Contract",options:["Grow","Contract","Open","Build"]}
]
};

let playerName = "";
let selectedChallenge = "";
let currentQuestions = [];
let currentQuestion = 0;
let score = 0;
let currentPage = "loginPage";

/* AUDIO */

const bgMusic =
document.getElementById("bgMusic");

const clickSound =
document.getElementById("clickSound");

let musicPlaying = false;

/* SOUND EFFECT */

function playClick(){

clickSound.currentTime = 0;
clickSound.play();

}

/* MUSIC CONTROL */

function toggleMusic(){

playClick();

const musicBtn =
document.getElementById("musicBtn");

if(musicPlaying){

bgMusic.pause();

musicPlaying = false;

musicBtn.innerHTML =
"🔇 MUSIC OFF";

}else{

bgMusic.play();

musicPlaying = true;

musicBtn.innerHTML =
"🔊 MUSIC ON";

}

}

/* PAGE CONTROL */

function showPage(id){

document.querySelectorAll(".container > div")
.forEach(page=>{
page.classList.add("hidden");
});

document.getElementById(id)
.classList.remove("hidden");

currentPage = id;

/* MUSIC BUTTON */

if(id !== "loginPage"){

document.getElementById("musicControls")
.classList.remove("hidden");

}else{

document.getElementById("musicControls")
.classList.add("hidden");

}

/* BACK BUTTON */

if(id === "loginPage" || id === "homePage"){

document.getElementById("backButton")
.classList.add("hidden");

}else{

document.getElementById("backButton")
.classList.remove("hidden");

}

}

/* BACK FUNCTION */

function goBack(){

playClick();

if(currentPage === "levelPage"){

showPage("homePage");

}
else if(currentPage === "quizPage"){

showPage("levelPage");

}
else if(currentPage === "resultPage"){

showPage("homePage");

}

}

/* START */

function startApp(){

playClick();

playerName =
document.getElementById("playerName").value;

if(playerName.trim() === ""){
alert("Please enter your name!");
return;
}

document.getElementById("welcomeText")
.innerHTML =
"Welcome, " + playerName;

showPage("homePage");

}

/* SELECT CHALLENGE */

function selectChallenge(type){

playClick();

selectedChallenge = type;

showPage("levelPage");

}

/* START QUIZ */

function startQuiz(level){

playClick();

currentQuestion = 0;
score = 0;

document.getElementById("score")
.innerHTML = score;

document.getElementById("currentLevel")
.innerHTML = level.toUpperCase();

if(selectedChallenge === "synonym"){
currentQuestions = synonymQuestions[level];
}else{
currentQuestions = antonymQuestions[level];
}

showPage("quizPage");

loadQuestion();

}

/* SHUFFLE OPTIONS */

function shuffleArray(array){

  for(let i = array.length - 1; i > 0; i--){

    const j = Math.floor(Math.random() * (i + 1));

    [array[i], array[j]] =
    [array[j], array[i]];

  }

  return array;

}

/* LOAD QUESTION */

function loadQuestion(){

const q = currentQuestions[currentQuestion];

document.getElementById("questionWord")
.innerHTML = q.word;

document.getElementById("questionNumber")
.innerHTML =
(currentQuestion + 1) + " / 10";

document.getElementById("challengeType")
.innerHTML =
selectedChallenge === "synonym"
? "Choose the synonym:"
: "Choose the antonym:";

document.getElementById("result")
.innerHTML = "";

const options =
document.getElementById("options");

options.innerHTML = "";

/* ACAK OPTIONS */

const shuffledOptions =
shuffleArray([...q.options]);

shuffledOptions.forEach(option=>{

const btn =
document.createElement("button");

btn.innerHTML = option;

btn.onclick = () => checkAnswer(option);

options.appendChild(btn);

});

}

/* CHECK ANSWER */

function checkAnswer(selected){

playClick();

const correct =
currentQuestions[currentQuestion].correct;

const buttons =
document.querySelectorAll(".options button");

buttons.forEach(btn=>{
btn.disabled = true;
});

if(selected === correct){

document.getElementById("result")
.innerHTML = "✅ CORRECT";

document.getElementById("result")
.style.color = "#00ff99";

score += 10;

}else{

document.getElementById("result")
.innerHTML =
"❌ WRONG | ANSWER: " + correct;

document.getElementById("result")
.style.color = "#ff4d4d";

}

document.getElementById("score")
.innerHTML = score;

setTimeout(()=>{

currentQuestion++;

if(currentQuestion < 10){

loadQuestion();

}else{

showResult();

}

},1200);

}

/* SHOW RESULT */

function showResult(){

showPage("resultPage");

document.getElementById("finalName")
.innerHTML = playerName;

document.getElementById("finalScore")
.innerHTML = score;

let message = "";

if(score === 100){
message = "🌟 YOU ESCAPED THE UPSIDE DOWN!";
}
else if(score >= 70){
message = "🔥 GREAT WORK!";
}
else if(score >= 50){
message = "⚡ GOOD EFFORT!";
}
else{
message = "👁 THE UPSIDE DOWN IS WATCHING...";
}

document.getElementById("finalMessage")
.innerHTML = message;

}

/* RESTART */

function restartGame(){

playClick();

showPage("loginPage");

document.getElementById("playerName")
.value = "";

}

/* AUTO PLAY MUSIC */

window.addEventListener("load", () => {

  bgMusic.volume = 0.5;

  const playPromise = bgMusic.play();

  if(playPromise !== undefined){

    playPromise.then(() => {

      musicPlaying = true;

    }).catch(() => {

      console.log(
        "Autoplay diblokir browser. Klik layar untuk memulai musik."
      );

    });

  }

});

/* BACKUP AUTOPLAY */

document.body.addEventListener("click", () => {

  if(!musicPlaying){

    bgMusic.play();

    musicPlaying = true;

  }

}, { once:true });

</script>
